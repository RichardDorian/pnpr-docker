name: Build and publish container images

on:
  push:
    tags: "*"

permissions:
  contents: read
  packages: write

env:
  CONTAINER_REGISTRY: ghcr.io

jobs:
  build-amd64:
    name: Build amd64 image
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64
          outputs: type=image,name=${{ env.CONTAINER_REGISTRY }}/richarddorian/pnpr,push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=buildkit-amd64
          cache-to: type=gha,mode=max,scope=buildkit-amd64
          build-args: |
            PNPR_VERSION=${{ github.ref_name }}

  build-arm64:
    name: Build arm64 image
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/arm64
          outputs: type=image,name=${{ env.CONTAINER_REGISTRY }}/richarddorian/pnpr,push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=buildkit-arm64
          cache-to: type=gha,mode=max,scope=buildkit-arm64
          build-args: |
            PNPR_VERSION=${{ github.ref_name }}

  merge-manifest:
    name: Merge multi-arch image
    runs-on: ubuntu-24.04
    needs:
      - build-amd64
      - build-arm64
    if: github.event_name == 'push'
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push manifest
        run: |
          docker buildx imagetools create -t ${{ env.CONTAINER_REGISTRY }}/richarddorian/pnpr:${{ github.ref_name }} \
          ${{ env.CONTAINER_REGISTRY }}/richarddorian/pnpr@${{ needs.build-amd64.outputs.digest }} \
          ${{ env.CONTAINER_REGISTRY }}/richarddorian/pnpr@${{ needs.build-arm64.outputs.digest }}
